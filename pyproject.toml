[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-solver"
version = "0.1.0"
description = "Free and open-source 2D structural beam analysis application"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "fpdf2>=2.7.0",
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
